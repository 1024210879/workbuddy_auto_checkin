name: Buddy 加油站每日自动化

# 注意：本文件是仓库唯一的 workflow。下方 3 条 cron 是同一 workflow 的 3 个
# 触发时刻（互为备份），不是 3 个 workflow；每次触发产生一次 run，
# run 内含 prepare + 每账号一个「签到」job（账号数由仓库变量 WB_ACCOUNTS 决定）。

on:
  schedule:
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 因此设三个时段互为备份 —— 只要有一个跑到，当天就完成了。
    # 脚本是幂等的：已签过只会返回「今日已签过」，名额用完不会重派，
    # 所以多触发不会重复领取。
    #
    # 间隔取 6 小时，是因为猫猫旅行时长最长 4 小时（travel/config 的
    # duration_hours_max），这样下一轮运行时它必定已经到家，可以领回礼物。
    # 三个点都落在 :10，避开 GitHub 文档提示的整点高负载期。
    #
    # 注意 cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 账号清单
  # 仓库变量 WB_ACCOUNTS（注意是 Variables 不是 Secrets）决定要跑几个账号：
  #   [{"id":"MAIN","label":"主号"},{"id":"WORK","label":"工作号"}]
  # 不设置该变量时，按单账号模式跑（沿用旧的 WB_ACCESS_TOKEN）。
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.accounts.outputs.matrix }}
    steps:
      - name: 解析账号清单
        id: accounts
        env:
          RAW: ${{ vars.WB_ACCOUNTS }}
        run: |
          set -euo pipefail
          python3 - "$RAW" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          raw = (sys.argv[1] if len(sys.argv) > 1 else "").strip()

          def fail(msg):
              sys.exit("WB_ACCOUNTS 配置有误：" + msg)

          # 未配置变量时按单账号跑，等价于旧行为
          if not raw:
              raw = '[{"id":"MAIN","label":"默认账号"}]'

          try:
              data = json.loads(raw)
          except ValueError as e:
              fail("不是合法 JSON（%s）" % e)
          if isinstance(data, dict):
              data = [data]
          if not isinstance(data, list) or not data:
              fail('必须是 JSON 数组，例如 [{"id":"MAIN","label":"主号"}]')

          accounts = []
          for i, item in enumerate(data):
              if isinstance(item, str):
                  item = {"id": item}
              if not isinstance(item, dict):
                  fail("第 %d 项不是对象" % (i + 1))
              aid = str(item.get("id") or "").strip().upper()
              if not re.fullmatch(r"[A-Z0-9_]{1,32}", aid):
                  fail("第 %d 项的 id 非法：只允许 A-Z 0-9 _，1~32 位" % (i + 1))
              label = str(item.get("label") or aid).replace("\r", " ").replace("\n", " ").strip()
              secret = str(item.get("secret") or "").strip()
              # 默认取 WB_ACCESS_TOKEN_<ID>；MAIN 兼容单账号时期的旧名字
              if not secret:
                  secret = "WB_ACCESS_TOKEN" if aid == "MAIN" else "WB_ACCESS_TOKEN_" + aid
              # webhook 名在这里算好，工作流里就只剩 secrets[matrix.webhook] 这种
              # 纯属性访问，不必在索引表达式里套 format()
              accounts.append({"id": aid, "label": label or aid,
                               "secret": secret, "webhook": "FEISHU_WEBHOOK_" + aid})

          ids = [a["id"] for a in accounts]
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if dup:
              fail("id 重复：%s" % ", ".join(dup))

          # 单行 JSON：GITHUB_OUTPUT 不支持多行值
          print("matrix=" + json.dumps(accounts, ensure_ascii=False, separators=(",", ":")))
          for a in accounts:
              print("  · %s（%s）→ 令牌 %s / 推送 %s"
                    % (a["label"], a["id"], a["secret"], a["webhook"] + " 或 FEISHU_WEBHOOK"),
                    file=sys.stderr)
          PY

  # ---------------------------------------------------------------- 逐账号执行
  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 签到 · ${{ matrix.label }}
    strategy:
      fail-fast: false          # 一个账号失败不影响其它账号
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # 按账号分组：同一账号的不同时段仍然串行，不同账号之间互不阻塞
    concurrency:
      group: wb-daily-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 定位 Python 解释器
        id: py
        # 解释器路径不写死版本号，动态取 runner 上可用的解释器
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到与派猫猫
        id: run
        env:
          # 每个账号取自己那份 Secret；缺失时为空字符串，由脚本明确报错（exit 2）
          WB_ACCESS_TOKEN: ${{ secrets[matrix.secret] }}
          # 账号专属 webhook 优先，没配就用全局的（未定义的 Secret 取值为空字符串，故用 || 兜底）
          FEISHU_WEBHOOK: ${{ secrets[matrix.webhook] || secrets.FEISHU_WEBHOOK }}
          WB_ACCOUNT: ${{ matrix.id }}
          WB_ACCOUNT_LABEL: ${{ matrix.label }}
          WB_TOKEN_SECRET: ${{ matrix.secret }}
          WB_ENDPOINT: https://copilot.tencent.com
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result_${{ matrix.id }}.md
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          set +e
          "$PY" wb_auto.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 签到成功即成功：脚本自身已把猫猫失败与签到结论解耦，
          # 这里统一以 0 退出，仅用 warning 提示存在未完成项。
          if [ "$code" -ne 0 ]; then
            echo "::warning::$WB_ACCOUNT_LABEL 本轮存在未完成项，详见上方日志与飞书卡片"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/wb_result_${{ matrix.id }}.md
          # 账号信息走环境变量而不是直接插进脚本：变量名拼错或含特殊字符都不会变成 shell 代码
          ACCOUNT_ID: ${{ matrix.id }}
          ACCOUNT_LABEL: ${{ matrix.label }}
          ACCOUNT_SECRET: ${{ matrix.secret }}
        run: |
          set -uo pipefail
          {
            echo "### Buddy 加油站每日自动化 · $ACCOUNT_LABEL"
            echo ""
            echo "- 账号：$ACCOUNT_ID（Secret $ACCOUNT_SECRET）"
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi
